<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Quote Saver</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <h1>Quote Corner</h1>
    <h3>Ever thought about a quote and didn't have paper?</h3>
    <h3>We Got You!</h3>

    <textarea id="quoteInput" placeholder="Type your quote here..."></textarea>

    <br><br>

    <button id="saveBtn">Save Quote</button>

    <h2>Your Saved Quotes</h2>
    <div id="quoteList"></div>

    <script src="script.js"></script>
</body>
</html>
